# Helm values of the bebbi-deep-research job service. Everything is configured here (GitOps, no click-ops).
# Reference of all variables: docs/operations.md.

replicaCount: 1            # 1 recommended (docs/operations.md). >1 only once job claims carry an owner token (stale re-queue
                           # can otherwise let two replicas finish the same job); RA_WORKERS / RA_DAY_WORKERS are per replica.

image:
  repository: ghcr.io/dcc-bs/bebbi-deep-research
  tag: ""                  # default: chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

service:
  port: 8088

# Plain (non-secret) configuration as environment variables.
env:
  RA_LLM_BASE_URL: http://vllm.llm.svc:8000/v1
  RA_LLM_MODEL_THINK: RedHatAI/gemma-4-31B-it-NVFP4
  RA_LLM_MODEL_FAST: RedHatAI/gemma-4-31B-it-NVFP4
  RA_LLM_MODEL_EMBED: Qwen/Qwen3-Embedding-4B
  # Thinking switch per role (chat template kwargs of vLLM). Verify the key against the model's chat template.
  RA_LLM_EXTRA_BODY_THINK: '{"chat_template_kwargs": {"enable_thinking": true}}'
  RA_LLM_EXTRA_BODY_FAST: '{"chat_template_kwargs": {"enable_thinking": false}}'
  RA_SEARCH_URL: https://google.serper.dev/search
  RA_FIRECRAWL_URL: http://firecrawl.web.svc:3002
  OWUI_URL: http://open-webui.open-webui.svc:8080
  RA_NIGHT_WINDOW: "20:00-05:00"
  RA_TIMEZONE: Europe/Zurich
  RA_WORKERS: "1"          # concurrent jobs inside the night window
  RA_DAY_WORKERS: "1"      # concurrent jobs outside it (only quick runs of focus presets start by day)
  RA_QUOTA_PER_DAY: "0"    # 0 = no quota
  RA_OWN_MAX_FILES: "10"             # own sources: uploaded files per research
  RA_OWN_MAX_FILE_CHARS: "2000000"   # ... extracted characters per file (longer is cut)
  RA_OWN_MAX_COLLECTIONS: "5"        # ... knowledge bases per research
  LOG_LEVEL: INFO

# Secrets are read from an existing Secret (SealedSecret / External Secrets / Vault). Keys default to the variable name.
# required: true makes the pod fail to start when the key is missing; false = variable stays unset.
secrets:
  existingSecret: bebbi-deep-research
  keys:
    HMAC_SECRET: {required: true}        # pseudonymises user ids in usage events (openssl rand 32 | base64)
    RA_TOKEN: {required: true}           # bearer token, same value as the SERVICE_TOKEN valve of the pipe. Full trust: its holder can read all jobs
    RA_DATABASE_URL: {required: true}    # postgresql://user:password@host:5432/db; URL-encode special characters in the password (@ -> %40, / -> %2F, : -> %3A, # -> %23)
    RA_LLM_API_KEY: {required: false}
    RA_LLM_EMBED_API_KEY: {required: false}   # only with env.RA_LLM_EMBED_BASE_URL (embeddings under another path)
    RA_SEARCH_KEY: {required: true}      # Serper key
    RA_FIRECRAWL_KEY: {required: false}
    OWUI_API_KEY: {required: false}      # API key of the Open WebUI admin service account (knowledge base retrieval, file dates)
    OWUI_DELIVERY_SECRET: {required: false}  # shared secret of the report delivery endpoint in the Open WebUI image (DCC_DEEP_RESEARCH_DELIVERY_SECRET there); unset = no delivery
    # Per variable another Secret / key name is possible: RA_SEARCH_KEY: {secretName: serper, key: api-key, required: true}

# Egress goes through the HTTP proxy. The LLM, Firecrawl, Open WebUI and Postgres are cluster-internal and MUST be in
# noProxy; the MCP servers (*.bs.ch) and Serper may or may not need the proxy, depending on where they are reachable.
# NO_PROXY syntax (httpx): comma-separated host names, domain suffixes (.svc), IPs and CIDRs. No wildcards.
proxy:
  http: http://proxy.bs.ch:3128
  https: http://proxy.bs.ch:3128
  noProxy: localhost,127.0.0.1,.svc,.cluster.local,.llm.svc

# Presets: by default the chart ships files/presets.yaml (copy of config/presets.yaml). Override inline or reference
# an own ConfigMap (key presets.yaml).
presets:
  existingConfigMap: ""
  inline: ""

extraEnv: []                 # raw container env entries
podAnnotations: {}
tmpSizeLimit: 100Mi          # emptyDir for /tmp (Kyverno caps emptyDir at 250Mi)
terminationGracePeriodSeconds: 45   # on SIGTERM running jobs are re-queued; uvicorn waits up to 20 s (Dockerfile entrypoint), keep this above that plus the re-queue
strategy: {type: Recreate}   # never two pods at once during a rollout (stale-job re-queue, worker counts)

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

nodeSelector: {}
tolerations: []

networkPolicy:
  enabled: false
  openWebUIPodLabels: {app.kubernetes.io/name: open-webui}
  openWebUINamespaceLabels: {}   # Open WebUI usually runs in another namespace: e.g. {kubernetes.io/metadata.name: open-webui}.
                                 # Set => the rule uses namespaceSelector AND podSelector; empty => only pods of this namespace match.
  extraIngressFrom: []        # e.g. n8n: [{podSelector: {matchLabels: {app: n8n}}}]
                              # Prometheus scraping /metrics: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  # Adapt to the cluster: DNS, the proxy, Postgres, the LLM service, Firecrawl, Open WebUI.
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 3128, protocol: TCP}]      # HTTP proxy
    - ports: [{port: 5432, protocol: TCP}]      # Postgres
    - ports: [{port: 8000, protocol: TCP}, {port: 3002, protocol: TCP}, {port: 8080, protocol: TCP}]   # vLLM, Firecrawl, Open WebUI
    - ports: [{port: 443, protocol: TCP}]       # MCP servers / Serper if reachable directly (no proxy)
