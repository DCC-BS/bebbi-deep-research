{{- if .Values.serviceMonitor.enabled }}
# Prometheus operator: scrape GET /metrics (jobs per status, night window, engine counters). With the NetworkPolicy on,
# Prometheus needs an entry in networkPolicy.extraIngressFrom.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bdr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bdr.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels: {{- include "bdr.selector" . | nindent 6 }}
{{- end }}
