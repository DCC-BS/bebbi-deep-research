name: Build and Publish Docker Image
on:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    # The image tag is the version in pyproject.toml. kdkp-kiw-k8s-config pins it with its digest and Renovate
    # proposes the next version, so a version is pushed once: bump the version for a new build. The git tag
    # v<version> marks the published commit; kdkp-open-web-ui syncs pipe/ from the newest one.
    version-is-new:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Log in to GHCR
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Refuse a version that is already published
              shell: bash
              run: |
                  VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
                  IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
                  if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                      echo "::error::$IMAGE already exists. Bump the version in pyproject.toml (and Chart.yaml) for a new build."
                      exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
                      echo "::error::Tag v$VERSION already exists. Bump the version in pyproject.toml (and Chart.yaml) for a new build."
                      exit 1
                  fi
                  echo "$IMAGE is new"

    publish:
        needs: version-is-new
        uses: DCC-BS/ci-workflows/.github/workflows/publish-docker.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        secrets: inherit
        with:
            project_type: "python" # or "node"
            registry: ghcr.io
            image_name: ghcr.io/${{ github.repository }}
            context: .
            dockerfile: ./Dockerfile
            platforms: linux/amd64
            push: true
            inject_github_token: true

    # Lightweight tag on the commit that was just published. GITHUB_TOKEN cannot create a ref at a commit whose
    # workflow files differ from the branch head (403 "Resource not accessible by integration"): a workflow change
    # merged during the build broke v1.2.5. So the tag comes from the DCC-BS release App (contents + workflows: write,
    # org secrets RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY).
    tag:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Release App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-workflows: write

            - name: Tag v<version>
              shell: bash
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
                  gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
                  echo "Tagged $GITHUB_SHA as v$VERSION"
