name: Main

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"

permissions:
    contents: read

jobs:
    backend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
        permissions:
            contents: read
            pull-requests: write
        with:
            check-command: "mise run ci-check"

    # kdkp-open-web-ui ships pipe/ from the newest v<version> tag, and the publish workflow tags only a new version.
    # A pull request that changes pipe/ therefore bumps the version in pyproject.toml, or the change never ships.
    version-bump:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: pipe/ changes bump the version
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  version() { python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'; }
                  BASE=$(git merge-base "$BASE_SHA" HEAD)
                  if git diff --quiet "$BASE" HEAD -- pipe/; then
                      echo "pipe/ unchanged"
                      exit 0
                  fi
                  OLD=$(git show "$BASE:pyproject.toml" | version)
                  NEW=$(version < pyproject.toml)
                  if [ "$OLD" = "$NEW" ]; then
                      echo "::error file=pyproject.toml::pipe/ changed but the version is still $OLD. Bump pyproject.toml and deploy/helm/bebbi-deep-research/Chart.yaml (version, appVersion), then run uv lock."
                      exit 1
                  fi
                  echo "pipe/ changed, version $OLD -> $NEW"

    # The queue (atomic claim, owner token, requeue, schema upgrade) runs on Postgres in Kubernetes; the shared
    # backend-ci job above tests it on SQLite only. Same suites against a throwaway Postgres.
    postgres:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 3s
                    --health-retries 20
        env:
            RA_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

            - name: Integration tests (Postgres only)
              run: uv run --locked python -m pytest tests/integration

            - name: Unit tests on Postgres
              env:
                  APP_MODE: ci
              run: uv run --locked python -m pytest tests/unit
