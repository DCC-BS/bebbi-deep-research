[project]
name = "bebbi-deep-research"
version = "1.0.0"
description = "Deep-research agent and job service for Bebbi Bot (Open WebUI, Kanton Basel-Stadt)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.109",
    "pyyaml>=6.0",
    "json-repair>=0.50",
    "rapidfuzz>=3.13",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "tzdata>=2024.2",
]

[project.scripts]
bebbi-deep-research = "service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent", "service"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv", "research_agent"]   # engine is kept as evaluated (v5), not re-linted

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "E701", "B008"]
