repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Helm templates are not plain YAML; ruamel rejects the `[mcp:x, web]` flow lists PyYAML reads.
        exclude: ^deploy/helm/.*/templates/|presets\.yaml$
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json|.vscode/.*
      - id: pretty-format-json
        # deploy/openwebui/*.json is generated (scripts/build_openwebui_assets.py, test_openwebui_assets_up_to_date)
        exclude: ^.devcontainer/devcontainer.json|.vscode/.*|^deploy/openwebui/
        args: [--autofix]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.10"
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
