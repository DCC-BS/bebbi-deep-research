# Base service definitions; docker-compose.yml and docker-compose.dev.yml extend them.
# Variables come from varlock (.env.schema): `mise run docker:up` wraps compose in `varlock run`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: research
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20

  service:
    image: ghcr.io/dcc-bs/bebbi-deep-research:${IMAGE_TAG:-dev}
    environment:
      APP_MODE: prod
      RA_DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD}@postgres:5432/research
      RA_TOKEN: ${RA_TOKEN:?set RA_TOKEN}
      HMAC_SECRET: ${HMAC_SECRET:?set HMAC_SECRET}
      RA_LLM_BASE_URL: ${RA_LLM_BASE_URL:?set RA_LLM_BASE_URL}
      RA_LLM_API_KEY: ${RA_LLM_API_KEY:-}
      RA_LLM_MODEL_THINK: ${RA_LLM_MODEL_THINK:-gemma-think}
      RA_LLM_MODEL_FAST: ${RA_LLM_MODEL_FAST:-gemma-fast}
      RA_LLM_MODEL_EMBED: ${RA_LLM_MODEL_EMBED:-qwen-embed}
      RA_LLM_EXTRA_BODY_THINK: ${RA_LLM_EXTRA_BODY_THINK:-}
      RA_LLM_EXTRA_BODY_FAST: ${RA_LLM_EXTRA_BODY_FAST:-}
      RA_SEARCH_URL: ${RA_SEARCH_URL:?set RA_SEARCH_URL}
      RA_SEARCH_KEY: ${RA_SEARCH_KEY:-}
      RA_FIRECRAWL_URL: ${RA_FIRECRAWL_URL:?set RA_FIRECRAWL_URL}
      RA_FIRECRAWL_KEY: ${RA_FIRECRAWL_KEY:-}
      RA_NIGHT_WINDOW: ${RA_NIGHT_WINDOW:-20:00-05:00}
      RA_TIMEZONE: ${RA_TIMEZONE:-Europe/Zurich}
      RA_WORKERS: ${RA_WORKERS:-1}
      RA_DAY_WORKERS: ${RA_DAY_WORKERS:-1}
      RA_QUOTA_PER_DAY: ${RA_QUOTA_PER_DAY:-0}
      RA_POLL_SECONDS: ${RA_POLL_SECONDS:-5}
      RA_STALE_SECONDS: ${RA_STALE_SECONDS:-120}
      RA_JOB_TIMEOUT_SECONDS: ${RA_JOB_TIMEOUT_SECONDS:-3600}
      RA_OWN_MAX_FILES: ${RA_OWN_MAX_FILES:-10}
      RA_OWN_MAX_FILE_CHARS: ${RA_OWN_MAX_FILE_CHARS:-2000000}
      RA_OWN_MAX_COLLECTIONS: ${RA_OWN_MAX_COLLECTIONS:-5}
      OWUI_URL: ${OWUI_URL:-http://open-webui:8080}
      OWUI_API_KEY: ${OWUI_API_KEY:-}
      OWUI_DELIVERY_SECRET: ${OWUI_DELIVERY_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,open-webui,service,postgres}
    expose: ["8088"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8088/health/liveness', timeout=2)"]
      interval: 30s
      timeout: 3s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: "false"
      ENABLE_API_KEYS: "true"
      # as in production: an admin cannot read or write other users' chats (Open WebUI 0.12 enforces it)
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      # read by the delivery hook of the kdkp image (not in upstream images: see docs/integration.md section 3)
      DCC_DEEP_RESEARCH_DELIVERY_SECRET: ${OWUI_DELIVERY_SECRET:-}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      OPENAI_API_BASE_URL: ${RA_LLM_BASE_URL}
      OPENAI_API_KEY: ${RA_LLM_API_KEY:-none}
      OFFLINE_MODE: "true"
      ENABLE_OLLAMA_API: "false"
    volumes: [owui-data:/app/backend/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
